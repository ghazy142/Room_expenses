<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>حساب السكن</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #0a0d14;
    --surface: #111827;
    --surface2: #1a2235;
    --border: rgba(255,255,255,0.07);
    --accent-g: #00e5a0;
    --accent-m: #6c8fff;
    --text: #f0f4ff;
    --text-muted: #6b7a99;
    --danger: #ff4d6d;
    --success: #00e5a0;
    --radius: 14px;
    --radius-sm: 10px;

    /* ─── Mobile touch targets ─── */
    --tap-min: 48px;   /* minimum touch target height */
    --font-base: clamp(13px, 3.8vw, 16px);
    --font-sm:   clamp(11px, 3vw,   13px);
    --font-xs:   clamp(10px, 2.6vw, 12px);
    --font-lg:   clamp(15px, 4.2vw, 18px);
    --font-xl:   clamp(20px, 5.5vw, 26px);
    --pad-h: clamp(12px, 4vw, 20px);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  html { height: -webkit-fill-available; }

  body {
    font-family: 'IBM Plex Sans Arabic', sans-serif;
    background: var(--bg);
    color: var(--text);
    direction: rtl;
    min-height: 100dvh;
    min-height: -webkit-fill-available;
    display: flex;
    flex-direction: column;
    overflow-x: hidden;
    font-size: var(--font-base);
    /* Prevent pull-to-refresh on iOS */
    overscroll-behavior-y: none;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 60% 40% at 20% 10%, rgba(0,229,160,0.08) 0%, transparent 60%),
      radial-gradient(ellipse 50% 35% at 80% 80%, rgba(108,143,255,0.08) 0%, transparent 60%);
    pointer-events: none;
    z-index: 0;
  }

  /* ─── Login ─── */
  #login-screen {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 32px var(--pad-h);
    position: relative;
    z-index: 1;
  }

  .login-logo {
    width: clamp(60px, 18vw, 80px);
    height: clamp(60px, 18vw, 80px);
    background: linear-gradient(135deg, var(--accent-g), var(--accent-m));
    border-radius: clamp(18px, 5vw, 24px);
    display: flex; align-items: center; justify-content: center;
    font-size: clamp(28px, 8vw, 38px);
    margin-bottom: clamp(14px, 4vw, 20px);
    box-shadow: 0 8px 32px rgba(0,229,160,0.25);
  }

  .login-title {
    font-size: clamp(22px, 6.5vw, 28px);
    font-weight: 700;
    letter-spacing: -0.5px;
    margin-bottom: 6px;
  }
  .login-sub {
    color: var(--text-muted);
    font-size: var(--font-sm);
    margin-bottom: clamp(32px, 9vw, 52px);
    text-align: center;
  }
  .login-label {
    font-size: var(--font-xs);
    font-weight: 500;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 14px;
  }

  .login-cards {
    display: flex;
    gap: clamp(10px, 3vw, 16px);
    width: 100%;
    max-width: 340px;
  }

  .login-card {
    flex: 1;
    border: 1.5px solid var(--border);
    background: var(--surface);
    border-radius: var(--radius);
    padding: clamp(18px, 5vw, 26px) clamp(12px, 3.5vw, 18px);
    cursor: pointer;
    transition: all 0.2s ease;
    display: flex; flex-direction: column; align-items: center;
    gap: clamp(8px, 2.5vw, 12px);
    position: relative; overflow: hidden;
    /* min touch target */
    min-height: 110px;
  }

  .login-card::after { content: ''; position: absolute; inset: 0; opacity: 0; transition: opacity 0.2s; }
  .login-card.ghazy::after { background: linear-gradient(135deg, rgba(0,229,160,0.12), transparent); }
  .login-card.mazen::after { background: linear-gradient(135deg, rgba(108,143,255,0.12), transparent); }
  .login-card:active::after { opacity: 1; }
  .login-card:active { transform: scale(0.97); border-color: rgba(255,255,255,0.15); }

  .login-card .avatar {
    width: clamp(46px, 13vw, 58px);
    height: clamp(46px, 13vw, 58px);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: clamp(18px, 5vw, 24px);
    font-weight: 700;
  }
  .login-card.ghazy .avatar { background: rgba(0,229,160,0.15); color: var(--accent-g); border: 2px solid rgba(0,229,160,0.3); }
  .login-card.mazen .avatar { background: rgba(108,143,255,0.15); color: var(--accent-m); border: 2px solid rgba(108,143,255,0.3); }
  .login-card .name { font-weight: 600; font-size: var(--font-lg); }

  /* ─── App ─── */
  #app { display: none; flex-direction: column; min-height: 100dvh; position: relative; z-index: 1; }

  /* ─── Header ─── */
  .header {
    padding: clamp(10px, 3vw, 16px) var(--pad-h);
    display: flex; align-items: center; justify-content: space-between;
    border-bottom: 1px solid var(--border);
    background: rgba(10,13,20,0.85);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    position: sticky; top: 0; z-index: 10;
    min-height: 56px;
  }

  .header-left { display: flex; align-items: center; gap: 10px; }

  .header-user {
    width: clamp(34px, 9vw, 40px);
    height: clamp(34px, 9vw, 40px);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700;
    font-size: clamp(13px, 3.5vw, 16px);
    flex-shrink: 0;
  }
  .header-user.me     { background: rgba(0,229,160,0.15); color: var(--accent-g); border: 1.5px solid rgba(0,229,160,0.3); }
  .header-user.friend { background: rgba(108,143,255,0.15); color: var(--accent-m); border: 1.5px solid rgba(108,143,255,0.3); }

  .header-name   { font-weight: 600; font-size: var(--font-base); }
  .header-status { font-size: var(--font-xs); color: var(--text-muted); }

  .logout-btn {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text-muted);
    font-size: var(--font-xs);
    padding: 0 clamp(10px, 3vw, 14px);
    border-radius: 8px;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.15s;
    height: clamp(32px, 8.5vw, 38px);
    min-width: 56px;
    white-space: nowrap;
  }
  .logout-btn:active { background: var(--surface); color: var(--text); }

  /* ─── Balance ─── */
  .balance-section { padding: clamp(10px, 3vw, 16px) var(--pad-h) 0; }

  .balance-net {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: clamp(14px, 4vw, 20px) clamp(14px, 4vw, 20px);
    margin-bottom: clamp(8px, 2.5vw, 12px);
    display: flex; align-items: center; justify-content: space-between;
    gap: 8px;
  }
  .balance-net-label  { font-size: var(--font-xs); color: var(--text-muted); margin-bottom: 3px; }
  .balance-net-amount {
    font-size: var(--font-xl);
    font-weight: 700;
    letter-spacing: -1px;
    line-height: 1;
  }
  .balance-net-amount.positive { color: var(--accent-g); }
  .balance-net-amount.negative { color: #ff6b8a; }
  .balance-net-amount.zero     { color: var(--text-muted); }

  .balance-net-badge {
    font-size: var(--font-xs);
    padding: clamp(4px, 1.2vw, 6px) clamp(8px, 2.5vw, 12px);
    border-radius: 20px;
    font-weight: 600;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .balance-net-badge.positive { background: rgba(0,229,160,0.12); color: var(--accent-g); border: 1px solid rgba(0,229,160,0.2); }
  .balance-net-badge.negative { background: rgba(255,75,109,0.12); color: #ff6b8a; border: 1px solid rgba(255,75,109,0.2); }
  .balance-net-badge.zero     { background: var(--surface2); color: var(--text-muted); border: 1px solid var(--border); }

  .balance-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: clamp(8px, 2.5vw, 12px);
    margin-bottom: clamp(10px, 3vw, 16px);
  }

  .balance-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: clamp(10px, 3vw, 16px);
  }
  .balance-card-header { display: flex; align-items: center; gap: 7px; margin-bottom: 6px; }

  .balance-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
  .dot-g { background: var(--accent-g); box-shadow: 0 0 6px var(--accent-g); }
  .dot-m { background: var(--accent-m); box-shadow: 0 0 6px var(--accent-m); }

  .balance-card-name   { font-size: var(--font-xs); color: var(--text-muted); }
  .balance-card-amount { font-size: clamp(18px, 5vw, 22px); font-weight: 700; letter-spacing: -0.5px; }

  /* ─── Feed header ─── */
  .feed-header {
    padding: 4px var(--pad-h) 8px;
    font-size: var(--font-xs);
    font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  /* ─── Chat feed ─── */
  .chat-feed {
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 0 clamp(10px, 3vw, 16px) 200px;
    display: flex; flex-direction: column;
    gap: clamp(8px, 2.5vw, 12px);
    scroll-behavior: smooth;
  }
  .chat-feed::-webkit-scrollbar { width: 0; }

  .msg-row {
    display: flex;
    flex-direction: column;
    max-width: clamp(82%, 88vw, 88%);
    animation: msgIn 0.25s ease;
  }
  @keyframes msgIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

  .msg-row.me     { align-self: flex-end; align-items: flex-end; }
  .msg-row.friend { align-self: flex-start; align-items: flex-start; }

  .msg-bubble {
    padding: clamp(9px, 2.8vw, 13px) clamp(11px, 3.2vw, 16px);
    border-radius: 14px;
    font-size: var(--font-base);
    line-height: 1.55;
  }
  .msg-row.me .msg-bubble     { background: linear-gradient(135deg, rgba(0,229,160,0.2), rgba(0,229,160,0.1)); border: 1px solid rgba(0,229,160,0.25); border-bottom-right-radius: 4px; }
  .msg-row.friend .msg-bubble { background: var(--surface2); border: 1px solid var(--border); border-bottom-left-radius: 4px; }

  .msg-sender { font-size: var(--font-xs); font-weight: 600; margin-bottom: 3px; }
  .msg-row.me .msg-sender     { color: var(--accent-g); }
  .msg-row.friend .msg-sender { color: var(--accent-m); }

  .msg-desc   { font-weight: 500; }
  .msg-amount { font-size: clamp(16px, 4.8vw, 20px); font-weight: 700; letter-spacing: -0.5px; margin: 4px 0 2px; }
  .msg-row.me .msg-amount     { color: var(--accent-g); }
  .msg-row.friend .msg-amount { color: var(--accent-m); }

  .msg-tag { display: inline-block; font-size: var(--font-xs); padding: 2px 7px; border-radius: 10px; margin-bottom: 3px; font-weight: 600; }
  .msg-tag.split { background: rgba(255,200,80,0.15); color: #ffca50; border: 1px solid rgba(255,200,80,0.2); }
  .msg-tag.lend  { background: rgba(255,107,138,0.15); color: #ff6b8a; border: 1px solid rgba(255,107,138,0.2); }

  .msg-meta    { display: flex; align-items: center; gap: 6px; margin-top: 5px; }
  .msg-time    { font-size: var(--font-xs); color: var(--text-muted); }
  .msg-actions { display: flex; gap: 5px; }

  .action-btn {
    background: rgba(255,255,255,0.06);
    border: 1px solid var(--border);
    color: var(--text-muted);
    font-size: clamp(13px, 3.5vw, 15px);
    /* larger tap target */
    min-width: var(--tap-min);
    min-height: var(--tap-min);
    padding: 0 10px;
    border-radius: 8px;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.15s;
    display: flex; align-items: center; justify-content: center;
  }
  .action-btn:active     { background: rgba(255,255,255,0.12); color: var(--text); }
  .action-btn.del:active { background: rgba(255,77,109,0.15); color: var(--danger); }

  /* ─── Input Sheet ─── */
  .input-sheet {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: rgba(17,24,39,0.97);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border-top: 1px solid var(--border);
    padding: clamp(10px, 3vw, 14px) var(--pad-h);
    padding-bottom: calc(clamp(10px, 3vw, 14px) + env(safe-area-inset-bottom, 0px));
    z-index: 20;
  }

  .input-type-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: clamp(6px, 2vw, 10px);
    margin-bottom: clamp(8px, 2.5vw, 12px);
  }

  .type-chip {
    padding: 0 clamp(8px, 2.5vw, 12px);
    height: var(--tap-min);
    border-radius: var(--radius-sm);
    border: 1.5px solid var(--border);
    background: var(--surface);
    color: var(--text-muted);
    font-family: inherit;
    font-size: clamp(12px, 3.5vw, 14px);
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s;
    display: flex; align-items: center; justify-content: center; gap: 5px;
    white-space: nowrap;
  }
  .type-chip.active.split-chip { background: rgba(255,200,80,0.12); border-color: rgba(255,200,80,0.4); color: #ffca50; }
  .type-chip.active.lend-chip  { background: rgba(255,107,138,0.12); border-color: rgba(255,107,138,0.4); color: #ff6b8a; }

  .input-row {
    display: flex;
    gap: clamp(6px, 2vw, 10px);
    align-items: center;
  }

  .input-field {
    background: var(--surface2);
    border: 1.5px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text);
    font-family: inherit;
    font-size: clamp(14px, 4vw, 16px);
    padding: 0 clamp(10px, 3vw, 14px);
    height: var(--tap-min);
    outline: none;
    transition: border-color 0.15s;
    direction: rtl;
    /* Prevent iOS zoom on focus (font-size >= 16px) */
    -webkit-text-size-adjust: 100%;
  }
  .input-field:focus       { border-color: rgba(0,229,160,0.4); }
  .input-field::placeholder { color: var(--text-muted); }

  .input-field.num  { width: clamp(80px, 24vw, 110px); flex-shrink: 0; }
  .input-field.desc { flex: 1; min-width: 0; }

  .send-btn {
    width: var(--tap-min);
    height: var(--tap-min);
    border-radius: 12px;
    background: linear-gradient(135deg, var(--accent-g), #00b87a);
    border: none;
    color: #0a0d14;
    font-size: clamp(20px, 5.5vw, 24px);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    transition: all 0.15s;
    box-shadow: 0 4px 14px rgba(0,229,160,0.3);
    font-weight: 700;
  }
  .send-btn:active { transform: scale(0.93); box-shadow: none; }

  /* ─── Empty ─── */
  .empty { text-align: center; color: var(--text-muted); padding: 40px 20px; font-size: var(--font-base); }
  .empty-icon { font-size: clamp(32px, 10vw, 44px); margin-bottom: 10px; }

  /* ─── Toast ─── */
  .toast {
    position: fixed;
    top: max(70px, calc(56px + env(safe-area-inset-top, 0px)));
    left: 50%;
    transform: translateX(-50%) translateY(-10px);
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    font-size: var(--font-sm);
    padding: clamp(8px, 2.5vw, 11px) clamp(14px, 4.5vw, 20px);
    border-radius: 30px;
    z-index: 100;
    opacity: 0;
    transition: all 0.3s;
    white-space: nowrap;
    pointer-events: none;
    max-width: 80vw;
    text-align: center;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ─── Modal ─── */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.75);
    display: flex; align-items: flex-end; justify-content: center;
    z-index: 50; opacity: 0; pointer-events: none; transition: opacity 0.2s;
  }
  .modal-overlay.open { opacity: 1; pointer-events: all; }

  .modal-box {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px 20px 0 0;
    padding: clamp(20px, 6vw, 28px) var(--pad-h);
    padding-bottom: calc(clamp(24px, 7vw, 36px) + env(safe-area-inset-bottom, 0px));
    width: 100%; max-width: 480px;
    transform: translateY(40px); transition: transform 0.25s;
  }
  .modal-overlay.open .modal-box { transform: translateY(0); }

  .modal-title { font-size: var(--font-lg); font-weight: 600; margin-bottom: 12px; }

  .modal-desc { color: var(--text-muted); font-size: var(--font-sm); margin-bottom: clamp(16px, 5vw, 24px); }

  .modal-input {
    width: 100%;
    background: var(--surface2);
    border: 1.5px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text);
    font-family: inherit;
    font-size: clamp(15px, 4.5vw, 17px);
    padding: 0 14px;
    height: clamp(48px, 13vw, 56px);
    outline: none;
    direction: rtl;
    margin-bottom: 14px;
    transition: border-color 0.15s;
  }
  .modal-input:focus { border-color: rgba(0,229,160,0.4); }

  .modal-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  .modal-btn {
    height: clamp(46px, 12vw, 54px);
    border-radius: var(--radius-sm);
    border: none;
    font-family: inherit;
    font-size: var(--font-base);
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
  }
  .modal-btn.cancel  { background: var(--surface2); color: var(--text-muted); border: 1px solid var(--border); }
  .modal-btn.confirm { background: linear-gradient(135deg, var(--accent-g), #00b87a); color: #0a0d14; }
  .modal-btn.danger  { background: rgba(255,77,109,0.15); color: var(--danger); border: 1px solid rgba(255,77,109,0.25); }
  .modal-btn:active  { transform: scale(0.97); }

  /* ─── Extra small screens (< 360px) ─── */
  @media (max-width: 359px) {
    :root {
      --tap-min: 44px;
      --pad-h: 10px;
    }
    .login-cards { gap: 8px; }
    .balance-card-amount { font-size: 16px; }
    .msg-row { max-width: 92%; }
  }
</style>
</head>
<body>

<!-- ─── Login ─── -->
<div id="login-screen">
  <div class="login-logo">🏠</div>
  <div class="login-title">حساب السكن</div>
  <div class="login-sub">تتبع المصاريف المشتركة بسهولة</div>
  <div class="login-label">اختر حسابك</div>
  <div class="login-cards">
    <div class="login-card ghazy" onclick="login('me')">
      <div class="avatar">G</div>
      <div class="name">Ghazy</div>
    </div>
    <div class="login-card mazen" onclick="login('friend')">
      <div class="avatar">M</div>
      <div class="name">Mazen</div>
    </div>
  </div>
</div>

<!-- ─── App ─── -->
<div id="app">

  <div class="header">
    <div class="header-left">
      <div class="header-user" id="header-avatar"></div>
      <div>
        <div class="header-name" id="header-name"></div>
        <div class="header-status">مسجّل الدخول</div>
      </div>
    </div>
    <button class="logout-btn" onclick="logout()">خروج</button>
  </div>

  <div class="balance-section">
    <div class="balance-net">
      <div>
        <div class="balance-net-label">الرصيد الصافي</div>
        <div class="balance-net-amount" id="net-amount">0.00</div>
      </div>
      <div class="balance-net-badge" id="net-badge">متوازن ✔️</div>
    </div>
    <div class="balance-row">
      <div class="balance-card">
        <div class="balance-card-header">
          <div class="balance-dot dot-g"></div>
          <div class="balance-card-name">Ghazy دفع</div>
        </div>
        <div class="balance-card-amount" id="ghazy-paid">0.00</div>
      </div>
      <div class="balance-card">
        <div class="balance-card-header">
          <div class="balance-dot dot-m"></div>
          <div class="balance-card-name">Mazen دفع</div>
        </div>
        <div class="balance-card-amount" id="mazen-paid">0.00</div>
      </div>
    </div>
  </div>

  <div class="feed-header">السجل</div>
  <div class="chat-feed" id="chat"></div>

  <div class="input-sheet">
    <div class="input-type-row">
      <button class="type-chip split-chip active" id="chip-split" onclick="setType('split')">⚖️ مشترك</button>
      <button class="type-chip lend-chip"         id="chip-lend"  onclick="setType('lend')">💸 دفعت له</button>
    </div>
    <div class="input-row">
      <input class="input-field desc" type="text"   id="desc"   placeholder="الوصف..." />
      <input class="input-field num"  type="number" id="amount" placeholder="المبلغ" inputmode="decimal" step="any"/>
      <button class="send-btn" onclick="addExpense()">＋</button>
    </div>
  </div>
</div>

<!-- ─── Delete Modal ─── -->
<div class="modal-overlay" id="delete-modal">
  <div class="modal-box">
    <div class="modal-title">تأكيد الحذف</div>
    <p class="modal-desc">هل تريد حذف هذا السجل؟</p>
    <div class="modal-btns">
      <button class="modal-btn cancel"  onclick="closeModal('delete-modal')">إلغاء</button>
      <button class="modal-btn danger"  id="confirm-delete-btn">حذف</button>
    </div>
  </div>
</div>

<!-- ─── Edit Modal ─── -->
<div class="modal-overlay" id="edit-modal">
  <div class="modal-box">
    <div class="modal-title">تعديل المبلغ</div>
    <input class="modal-input" type="number" id="edit-amount-input" placeholder="المبلغ الجديد" inputmode="decimal" step="any"/>
    <div class="modal-btns">
      <button class="modal-btn cancel"  onclick="closeModal('edit-modal')">إلغاء</button>
      <button class="modal-btn confirm" id="confirm-edit-btn">حفظ</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp }    from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, addDoc, collection, onSnapshot, deleteDoc, doc, updateDoc }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey:            "AIzaSyDeNa-5ltXKbwIGghUkEDQKEXqkMtU9cy4",
  authDomain:        "room-expenses-af972.firebaseapp.com",
  projectId:         "room-expenses-af972",
  storageBucket:     "room-expenses-af972.firebasestorage.app",
  messagingSenderId: "249471352888",
  appId:             "1:249471352888:web:57b0f7a932b7cfe73e26cd",
  measurementId:     "G-78RXZKXW1M"
};

const app = initializeApp(firebaseConfig);
const db  = getFirestore(app);

let currentUser  = null;
let selectedType = 'split';

/* ── Toast ── */
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

/* ── Modal helpers ── */
window.closeModal = function(id) {
  document.getElementById(id).classList.remove('open');
};

function openModal(id) {
  document.getElementById(id).classList.add('open');
}

document.querySelectorAll('.modal-overlay').forEach(el => {
  el.addEventListener('click', e => {
    if (e.target === el) el.classList.remove('open');
  });
});

/* ── Type selector ── */
window.setType = function(type) {
  selectedType = type;
  document.getElementById('chip-split').classList.toggle('active', type === 'split');
  document.getElementById('chip-lend').classList.toggle('active',  type === 'lend');
};

/* ── Login ── */
window.login = function(user) {
  currentUser = user;
  const isMe  = user === 'me';
  document.getElementById('login-screen').style.display = 'none';
  const appEl = document.getElementById('app');
  appEl.style.display       = 'flex';
  appEl.style.flexDirection = 'column';

  const av = document.getElementById('header-avatar');
  av.textContent = isMe ? 'G' : 'M';
  av.className   = 'header-user ' + user;
  document.getElementById('header-name').textContent = isMe ? 'Ghazy' : 'Mazen';
};

/* ── Logout ── */
window.logout = function() {
  currentUser = null;
  document.getElementById('app').style.display        = 'none';
  document.getElementById('login-screen').style.display = 'flex';
};

/* ── Add expense ── */
window.addExpense = async function() {
  const amount = parseFloat(document.getElementById('amount').value);
  const desc   = document.getElementById('desc').value.trim();

  if (isNaN(amount) || amount <= 0) { toast('أدخل مبلغاً صحيحاً'); return; }
  if (!desc)                         { toast('أدخل وصفاً');          return; }

  try {
    await addDoc(collection(db, 'expenses'), {
      payer: currentUser,
      amount,
      desc,
      type: selectedType,
      time: new Date().toISOString()
    });
    document.getElementById('amount').value = '';
    document.getElementById('desc').value   = '';
    toast('تمت الإضافة ✓');
  } catch (err) {
    console.error(err);
    toast('خطأ في الإضافة، تحقق من الاتصال');
  }
};

/* ── Delete ── */
window.deleteExpense = function(id) {
  openModal('delete-modal');
  document.getElementById('confirm-delete-btn').onclick = async () => {
    closeModal('delete-modal');
    try {
      await deleteDoc(doc(db, 'expenses', id));
      toast('تم الحذف');
    } catch (err) {
      console.error(err);
      toast('خطأ في الحذف');
    }
  };
};

/* ── Edit ── */
window.editExpense = function(id, currentAmount) {
  const input = document.getElementById('edit-amount-input');
  input.value = currentAmount;
  openModal('edit-modal');
  document.getElementById('confirm-edit-btn').onclick = async () => {
    const n = parseFloat(input.value);
    if (isNaN(n) || n <= 0) { toast('مبلغ غير صحيح'); return; }
    closeModal('edit-modal');
    try {
      await updateDoc(doc(db, 'expenses', id), { amount: n });
      toast('تم التعديل ✓');
    } catch (err) {
      console.error(err);
      toast('خطأ في التعديل');
    }
  };
};

/* ── Realtime listener ── */
onSnapshot(collection(db, 'expenses'), (snapshot) => {
  const chat = document.getElementById('chat');
  chat.innerHTML = '';

  const docs = [];
  snapshot.forEach(d => docs.push({ id: d.id, ...d.data() }));
  docs.sort((a, b) => a.time.localeCompare(b.time));

  if (docs.length === 0) {
    chat.innerHTML = '<div class="empty"><div class="empty-icon">📋</div>لا توجد مصاريف بعد</div>';
  }

  let ghazyPaid = 0;
  let mazenPaid = 0;
  let netDebt   = 0;

  docs.forEach(data => {
    const paidByGhazy = data.payer === 'me';

    if (data.type === 'split') {
      const half = data.amount / 2;
      if (paidByGhazy) { ghazyPaid += data.amount; netDebt += half; }
      else             { mazenPaid += data.amount; netDebt -= half; }
    } else {
      if (paidByGhazy) { ghazyPaid += data.amount; netDebt += data.amount; }
      else             { mazenPaid += data.amount; netDebt -= data.amount; }
    }

    const name = paidByGhazy ? 'Ghazy' : 'Mazen';
    const date = new Date(data.time).toLocaleString('en-US', {
      day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit'
    });

    const row    = document.createElement('div');
    row.className = 'msg-row ' + (paidByGhazy ? 'me' : 'friend');

    const bubble = document.createElement('div');
    bubble.className = 'msg-bubble';

    const tag = document.createElement('span');
    tag.className   = 'msg-tag ' + data.type;
    tag.textContent = data.type === 'split' ? '⚖️ مشترك' : '💸 دفعت له';

    const br = document.createElement('br');

    const descSpan = document.createElement('span');
    descSpan.className   = 'msg-desc';
    descSpan.textContent = data.desc;

    const amountDiv = document.createElement('div');
    amountDiv.className   = 'msg-amount';
    amountDiv.textContent = data.amount.toFixed(2);

    bubble.appendChild(tag);
    bubble.appendChild(br);
    bubble.appendChild(descSpan);
    bubble.appendChild(amountDiv);

    const sender = document.createElement('div');
    sender.className   = 'msg-sender';
    sender.textContent = name;

    const meta    = document.createElement('div');
    meta.className = 'msg-meta';

    const timeSpan = document.createElement('span');
    timeSpan.className   = 'msg-time';
    timeSpan.textContent = date;

    const actions = document.createElement('div');
    actions.className = 'msg-actions';

    const editBtn = document.createElement('button');
    editBtn.className   = 'action-btn';
    editBtn.textContent = '✏️';
    editBtn.onclick     = () => window.editExpense(data.id, data.amount);

    const delBtn = document.createElement('button');
    delBtn.className   = 'action-btn del';
    delBtn.textContent = '🗑';
    delBtn.onclick     = () => window.deleteExpense(data.id);

    actions.appendChild(editBtn);
    actions.appendChild(delBtn);
    meta.appendChild(timeSpan);
    meta.appendChild(actions);

    row.appendChild(sender);
    row.appendChild(bubble);
    row.appendChild(meta);

    chat.appendChild(row);
  });

  chat.scrollTop = chat.scrollHeight;

  document.getElementById('ghazy-paid').textContent = ghazyPaid.toFixed(2);
  document.getElementById('mazen-paid').textContent = mazenPaid.toFixed(2);

  const netEl   = document.getElementById('net-amount');
  const badgeEl = document.getElementById('net-badge');

  if (netDebt > 0.01) {
    netEl.textContent = '+' + netDebt.toFixed(2);
    netEl.className   = 'balance-net-amount positive';
    badgeEl.textContent = 'Mazen مدين 💵';
    badgeEl.className   = 'balance-net-badge positive';
  } else if (netDebt < -0.01) {
    netEl.textContent = netDebt.toFixed(2);
    netEl.className   = 'balance-net-amount negative';
    badgeEl.textContent = 'Ghazy مدين 💸';
    badgeEl.className   = 'balance-net-badge negative';
  } else {
    netEl.textContent = '0.00';
    netEl.className   = 'balance-net-amount zero';
    badgeEl.textContent = 'متوازن ✔️';
    badgeEl.className   = 'balance-net-badge zero';
  }
}, (error) => {
  console.error('Firebase error:', error);
  toast('خطأ في الاتصال بالقاعدة');
});
</script>
</body>
</html>
